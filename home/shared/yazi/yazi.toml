[opener]
xdg = [
  { run = "xdg-open \"$@\"", orphan = true, desc = "Open with the default application" },
]

zathura = [
  { run = "zathura \"$@\"", orphan = true, desc = "Open in Zathura" },
]

pdf_term = [
  { run = "$HOME/.config/yazi/open-pdf-in-terminal.sh \"$1\"", block = true, desc = "Read PDF in terminal" },
]

media_term = [
  { run = "mpv --vo=kitty --vo-kitty-use-shm=yes \"$1\" || mpv --vo=tct \"$1\"", block = true, desc = "Play media in terminal" },
]

[open]
prepend_rules = [
  { mime = "inode/directory", use = "xdg" },
  { mime = "application/pdf", use = "zathura" },
  { mime = "video/*", use = "media_term" },
  { mime = "audio/*", use = "media_term" },
]
